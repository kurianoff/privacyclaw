[package]
name = "privacyclaw"
version = "0.3.0"
edition = "2021"
description = "Local MITM privacy proxy for LLM API traffic inspection"
license = "MIT"

[[bin]]
name = "privacyclaw"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.24"
rust-embed = "8"
dirs = "5"
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
rustls-pki-types = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rustls-pemfile = "2"
aho-corasick = "1.1"
regex = "1"
fancy-regex = "0.13"
fake = { version = "2.9", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"], optional = true }
tokenizers = { version = "0.19", optional = true }
ndarray = { version = "0.16", optional = true }
tray-icon = { version = "0.19", optional = true }
objc2 = { version = "0.5", optional = true }

[features]
ort-ner = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
# macOS menu-bar tray icon. Build with: cargo build --features tray
# The tray module is cfg-gated to target_os = "macos"; this feature is a no-op on other OSes.
tray = ["dep:tray-icon", "dep:objc2"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
mockito = "1"

[[test]]
name = "pii_roundtrip_test"
path = "tests/integration/pii_roundtrip_test.rs"

[[test]]
name = "vault_persistence_test"
path = "tests/integration/vault_persistence_test.rs"

[[test]]
name = "multiturn_consistency_test"
path = "tests/integration/multiturn_consistency_test.rs"

[[test]]
name = "passthrough_no_pii_test"
path = "tests/integration/passthrough_no_pii_test.rs"

[[test]]
name = "pii_proxy_intercept_test"
path = "tests/integration/pii_proxy_intercept_test.rs"

[[test]]
name = "pii_config_tests"
path = "tests/pii_config_tests.rs"

# ── E2E process-level tests ───────────────────────────────────────────────────
# These spawn the real binary; run with `cargo test --test e2e_init_test` etc.
# They require `cargo build` to have run first (handled automatically by cargo test).

[[test]]
name = "e2e_init_test"
path = "tests/e2e/init_test.rs"

[[test]]
name = "e2e_proxy_lifecycle_test"
path = "tests/e2e/proxy_lifecycle_test.rs"

[[test]]
name = "network_proxy_test"
path = "tests/e2e/network_proxy_test.rs"

[[test]]
name = "brew_formula_test"
path = "tests/brew_formula_test.rs"

[[test]]
name = "pkg_build_test"
path = "tests/pkg_build_test.rs"

[[test]]
name = "proxy_toggle_test"
path = "tests/proxy_toggle_test.rs"

[[test]]
name = "t3_standalone_roundtrip"
path = "tests/t3_standalone_roundtrip.rs"

[[test]]
name = "logging_instrumentation_tests"
path = "tests/logging_instrumentation_tests.rs"

[[test]]
name = "stress_test"
path = "tests/integration/stress_test.rs"

[[test]]
name = "detection_log_test"
path = "tests/detection_log_test.rs"

[[test]]
name = "vault_confidence_test"
path = "tests/vault_confidence_test.rs"

[[test]]
name = "config_cmd_test"
path = "tests/config_cmd_test.rs"

[[test]]
name = "sleep_wake_regression_test"
path = "tests/sleep_wake_regression_test.rs"

[[test]]
name = "model_weight_mgmt_test"
path = "tests/model_weight_mgmt_test.rs"
