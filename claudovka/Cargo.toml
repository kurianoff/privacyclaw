[package]
name = "claudovka"
version = "0.1.0"
edition = "2021"
description = "Local MITM privacy proxy for LLM API traffic inspection"
license = "MIT"

[[bin]]
name = "claudovka"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.24"
rust-embed = "8"
dirs = "5"
anyhow = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
rustls-pki-types = "1"
sha1 = "0.10"
base64 = "0.22"
rustls-pemfile = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
