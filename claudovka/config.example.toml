[proxy]
listen = "127.0.0.1:8080"      # CONNECT proxy listen address
dashboard = "127.0.0.1:8443"   # Web dashboard address

[intercept]
# Only MITM these domains. All other HTTPS is passed through transparently.
domains = [
  "api.anthropic.com",
  "api.openai.com",
  "generativelanguage.googleapis.com",
  "api.mistral.ai",
  "api.groq.com",
]

[network_proxy]
listen = "127.0.0.1:4443"      # Network-level proxy port (map 443 → here via pf)
enabled = false                 # Set true to also start in `claudovka start`

[storage]
path = "~/.config/claudovka/data.db"  # SQLite database
max_size_mb = 500                      # Auto-prune oldest conversations
retention_days = 30                    # Auto-delete after N days

[logging]
level = "info"                        # trace | debug | info | warn | error
